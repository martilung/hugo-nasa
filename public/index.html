<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PÄEVA KOSMOSEPILT – NASA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Üle ekraani kosmosepilt -->
  <div class="fullscreen-stage">
    <img id="space-image" class="fullscreen-image hidden" src="" alt="NASA PÄEVA KOSMOSEPILT" loading="eager" />
  </div>

  <!-- Laadimise teade all vasakus nurgas -->
  <section id="loading-state" class="corner-box status-box" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p class="status-text">LAEN NASA TÄNAST KOSMOSEPILTI...</p>
  </section>

  <!-- Veateade all vasakus nurgas -->
  <section id="error-state" class="corner-box status-box hidden" aria-live="assertive">
    <p id="error-message" class="status-text error-text">PILDI LAADIMINE EBAÕNNESTUS.</p>
    <button id="retry-btn" class="control-btn" type="button">PROOVI UUESTI</button>
  </section>

  <!-- Hall tekstikast all vasakus nurgas -->
  <aside id="content-state" class="corner-box info-box hidden" aria-label="PILDI SELGITUS">
    <div class="info-toolbar">
      <div class="meta-badges">
        <span class="nasa-badge">NASA PÄEVAPILT</span>
        <span id="date-display" class="date-text"></span>
      </div>
      <div class="toolbar-actions">
        <a id="open-full-btn" href="#" target="_blank" rel="noopener noreferrer" class="control-btn link-btn" title="AVA PILT ORIGINAALSUURUSES">
          ORIGINAALPILT ↗
        </a>
        <button id="toggle-text-btn" class="control-btn" type="button" aria-expanded="true">
          PEIDA TEKST
        </button>
      </div>
    </div>

    <div id="panel-body" class="panel-body">
      <h1 id="picture-title" class="picture-title"></h1>
      <div id="picture-explanation" class="explanation-text"></div>
      <p id="copyright-text" class="copyright-text">ALLIKAS: NASA</p>
    </div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
