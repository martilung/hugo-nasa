<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PÄEVA KOSMOSEPILT – NASA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="stars-bg" aria-hidden="true"></div>

  <main class="container">

      <p id="date-display" class="date-text">LAEN TÄNAST KUUPÄEVA...</p>

      <button id="retry-btn" class="action-btn" type="button">PROOVI UUESTI</button>

    <article id="content-state" class="card content-card hidden">
      <h1 id="picture-title" class="picture-title"></h1>

      <figure class="image-wrapper">
        <a id="hd-link" href="#" target="_blank" rel="noopener noreferrer" title="AVA PILT TÄISSUURUSES">
          <img id="space-image" src="" alt="NASA PÄEVA KOSMOSEPILT" loading="eager" />

        <figcaption class="image-caption">

          <a id="open-full-btn" href="#" target="_blank" rel="noopener noreferrer" class="full-link">
            AVA SUUR PILT ↗

      <section class="explanation-section" aria-label="PILDI SELGITUS">
        <h2 class="section-heading">MIS ON SELLEL PILDIL?</h2>
        <div id="picture-explanation" class="explanation-text"></div>
      </section>
    </article>

    <footer class="site-footer">
      <p>PILT UUENEB AUTOMAATSELT 1X PÄEVAS NASA APOD ANDMEBAASIST</p>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
